<!DOCTYPE html>
<!-- Source of assets/og.png (1200×630). Not published: Jekyll skips folders that start with "_".
     To rebuild: serve the repo root, open /_brand/og.html at a 1200×630 viewport, save a screenshot as assets/og.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>og.png source</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("../assets/fonts/instrument-sans-latin.woff2") format("woff2");
        font-weight: 400 700;
      }
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        color: #1a1a1a;
        font-family: "Instrument Sans", sans-serif;
        position: relative;
      }
      .copy { position: absolute; left: 82px; top: 50%; transform: translateY(-50%); }
      h1 { margin: 0; font-size: 100px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
      .lead { margin: 22px 0 0; font-size: 26px; color: #4a4a4a; letter-spacing: -0.005em; }
      .by { margin: 44px 0 0; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
      img { position: absolute; width: 560px; height: 560px; right: 30px; top: 35px; }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1>Chartwizard</h1>
      <p class="lead">IDX chart setups, found automatically.</p>
      <p class="by">by Codewizard</p>
    </div>
    <img src="../assets/codewizard.svg" alt="">
  </body>
</html>
