en:
  description: Charting and pattern scanning for Indonesia Stock Exchange stocks, for Windows. Free download.
  nav_download: Download
  nav_guide: Guide
  nav_activate: Activate Pro
  switch_label: ID
  switch_title: Baca dalam Bahasa Indonesia
  home_url: /en/
  guide_url: TUTORIALS.html
  activate_url: "ACTIVATE-PRO.html#english"
  footer_disclaimer: Chartwizard is charting software, not investment advice.
  footer_github: Releases on GitHub
  months: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]

  hero_tagline: Charting and pattern scanning for IDX stocks, for Windows.
  hero_intro: >-
    Chart every stock on the Indonesia Stock Exchange, find chart patterns automatically, and see which sectors are
    gaining strength. Free to use, with everything unlocked in Pro.
  download_button: Download for Windows
  version_label: Version
  requirements: Windows 10/11 64-bit
  all_versions: All versions
  file_fallback: Chartwizard-Setup-&lt;version&gt;.exe

  install_title: How to install
  install_steps:
    - title: Run the downloaded file
      body: >-
        Open <code>{file}</code> from your Downloads folder and follow the installer to the end.
    - title: Windows shows a warning? That's expected
      body: >-
        The Chartwizard installer is not code-signed yet, so Windows SmartScreen may show a blue
        <b>Windows protected your PC</b> screen. Click <b>More info</b>, then <b>Run anyway</b>.
      note: >-
        Windows shows this for every app that isn't signed, not because it found a virus. Want to be sure the file is
        genuine? Compare its SHA-256 at the bottom of this page.
    - title: Choose a data provider
      body: >-
        Open <b>Settings → Data provider</b>. <b>Yahoo Finance</b> needs no token; <b>EODHD</b> uses your own API
        token. The first sync downloads the price history, and after that the data updates by itself every day after
        the market closes.

  features_title: Features
  features:
    - title: Charts and patterns
      body: >-
        Candles, volume and RSI, indicators such as MACD, Bollinger Bands and Supertrend, drawing tools, and patterns
        found automatically: classic patterns, support/resistance, candlestick patterns and RSI divergences.
    - title: Scanner
      body: >-
        Every live setup across all IDX stocks in one list, with filters for liquidity, volume spikes and
        confirmation.
    - title: Screener
      pro: true
      body: >-
        Filter stocks by price, returns, trend, volume and fundamentals, or start from presets such as Top Gainers,
        Unusual Volume and Low P/E.
    - title: Sector rotation
      pro: true
      body: >-
        See which sectors are gaining or losing strength against IHSG, and each sector's strongest stocks.

  pricing_title: Free and Pro
  yes_word: "Yes"
  pricing_rows:
    - ["Chart: indicators, drawings, patterns and levels", "yes", "yes"]
    - ["Daily auto-sync", "yes", "yes"]
    - ["Scanner", "The top 5 setups", "Every setup and filter"]
    - ["Screener and Sectors", "", "yes"]
    - ["CSV export", "", "yes"]
    - ["Live intraday bars", "", "yes"]
  buy_monthly: Buy monthly
  buy_yearly: Buy yearly
  seats: One licence covers 2 PCs. Payment through Lynk.id.
  activate_link: How to activate Pro

  faq_title: Common questions
  faq:
    - q: Is it safe? Why does Windows warn me?
      a: >-
        The installer is not code-signed yet, and SmartScreen warns about every app like that. Download it only from
        this page or the GitHub releases page, and compare its SHA-256 if you want to be sure.
    - q: How do I update?
      a: >-
        From version 0.3.0, Chartwizard updates itself: the new version downloads in the background, and you click
        <b>Restart now</b> in the status bar to install it. On 0.1.0 or 0.2.0? Download the latest version above and
        install it over the old one once; updates come by themselves after that.
    - q: Where is my data kept?
      a: >-
        All of it stays on your PC, in <code>%APPDATA%\idx-chart</code>: prices, settings, your licence and a daily
        backup. Uninstalling keeps that folder, so reinstalling picks up where you left off.
    - q: Which Windows versions does it run on?
      a: Windows 10 and 11, 64-bit. There is no macOS or Linux version.

  verify_title: Check your download
  verify_hash_label: "The SHA-256 of this version's installer:"
  verify_command_label: "In PowerShell, run this in the folder where the file is saved, and compare the result:"
