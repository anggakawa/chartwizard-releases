  install_title: Cara memasang
  install_windows_heading: Windows
  install_mac_heading: macOS (Apple Silicon)
  install_steps:
    - title: Jalankan installer
      body: >-
        Buka <code>%file%</code> dari folder Downloads, lalu ikuti langkah pemasangan sampai selesai.
    - title: Peringatan SmartScreen?
      body: >-
        Installer belum memiliki tanda tangan digital, jadi Windows dapat menampilkan layar biru
        <b>Windows protected your PC</b>. Klik <b>More info</b>, lalu <b>Run anyway</b>.
      note: >-
        Peringatan ini muncul untuk aplikasi yang belum ditandatangani, bukan karena virus. Untuk memastikan file
        asli, cocokkan SHA-256 di bagian bawah halaman ini.
    - title: Pilih data provider
      body: >-
        Buka <b>Settings → Data provider</b>. Yahoo tidak memerlukan token; EODHD memakai API token milik Anda.
        Sinkronisasi pertama mengunduh riwayat harga; setelah itu data diperbarui otomatis setiap hari setelah market
        close.
  install_mac_steps:
    - title: Pasang dari DMG
      body: >-
        Buka file DMG, lalu seret Chartwizard ke folder <b>Applications</b>.
    - title: Peringatan Gatekeeper?
      body: >-
        Build Mac belum ditandatangani atau di-notarize, jadi macOS dapat menolak membuka aplikasi
        (<b>“Chartwizard” cannot be opened…</b>). Buka <b>System Settings → Privacy &amp; Security</b>, lalu klik
        <b>Open Anyway</b>.
      note: >-
        Peringatan ini untuk aplikasi yang belum ditandatangani Apple, bukan temuan virus. Unduh hanya dari halaman
        ini atau GitHub Releases.
    - title: Pilih data provider
      body: >-
        Buka <b>Settings → Data provider</b>. Yahoo tidak memerlukan token; EODHD memakai API token milik Anda.
        Sinkronisasi pertama mengunduh riwayat harga; setelah itu data diperbarui otomatis setiap hari setelah market
        close.

  features_title: Fitur utama
  features:
    - title: "Chart & pola"
      tab: Chart
      shot: chart
      alt: >-
        Chart harian BBCA di Chartwizard dengan pola double bottom yang ditemukan otomatis, target dan level
        invalidasinya, volume, RSI dan daftar pola.
      body: >-
        Candle, volume, RSI. Indikator MACD, Bollinger, Supertrend. Drawing tools. Pola otomatis: klasik,
        support/resistance, candlestick, divergensi RSI. Enam tema warna — dari gelap hingga pastel.
    - title: Scanner
      tab: Scanner
      shot: scanner
      alt: >-
        Scanner Chartwizard: setup yang sedang aktif di saham BEI, dengan bias, status, skor, rasio volume dan nilai
        transaksi.
      body: >-
        Semua setup aktif di BEI dalam satu daftar. Filter likuiditas, lonjakan volume, dan konfirmasi — tanpa harus
        membuka chart satu per satu.
    - title: Screener
      tab: Screener
      shot: screener
      alt: >-
        Screener Chartwizard dengan preset Most Active: harga, perubahan harian, volume, nilai transaksi dan
        kapitalisasi pasar.
      pro: true
      body: >-
        Filter berdasarkan harga, return, tren, volume, dan fundamental. Atau pakai preset: Top Gainers, Unusual
        Volume, Low P/E.
    - title: Rotasi sektor
      tab: Sektor
      shot: sectors
      alt: >-
        Rotasi sektor di Chartwizard: jalur setiap sektor terhadap IHSG, fase dan momentumnya, serta saham terkuat di
        sektor Financial Services.
      pro: true
      body: >-
        Sektor yang menguat atau melemah versus IHSG, plus saham terkuat di tiap sektor. Memerlukan EODHD (Yahoo tidak
        menyediakan data sektor).

  pricing_title: Free dan Pro
  yes_word: Ya
  pricing_rows:
    - ["Chart: indikator, drawing, pola dan level", "yes", "yes"]
    - ["Sinkronisasi harian otomatis", "yes", "yes"]
    - ["Scanner", "5 setup teratas", "Semua setup dan filter"]
    - ["Screener dan Sektor", "", "yes"]
