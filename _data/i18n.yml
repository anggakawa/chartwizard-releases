  size_label: Ukuran
  system_label: Sistem
  date_label: Rilis
  verify_link: Periksa SHA-256
  chart_title: >-
    Chart harian ARNB (ticker fiktif, data karangan) dengan double bottom yang ditemukan Chartwizard, plus target dan
    invalidasinya.
  tape_label: Contoh hasil scanner (data fiktif)
  sample_note: >-
    Chart, hasil scanner, dan screenshot di halaman ini memakai ticker, nama perusahaan, dan harga fiktif untuk ilustrasi,
    bukan data pasar sungguhan.
  requirements: Windows 10/11 64-bit · macOS Apple Silicon (arm64), Beta
  all_versions: Semua versi
  file_fallback: Chartwizard-Setup-&lt;versi&gt;.exe

  install_title: Cara memasang
  install_windows_heading: Windows
  install_mac_heading: macOS Apple Silicon (Beta)
  install_steps:
    - title: Jalankan installer
      body: >-
        Buka <code>%file%</code> dari folder Downloads, lalu ikuti langkah pemasangan sampai selesai.
    - title: Peringatan SmartScreen?
      body: >-
        Installer-nya belum ditandatangani secara digital, jadi Windows bisa menampilkan layar biru
        <b>Windows protected your PC</b>. Klik <b>More info</b>, lalu <b>Run anyway</b>.
      note: >-
        Peringatan ini muncul karena aplikasinya belum ditandatangani, bukan karena ada virus. Untuk memastikan
        file-nya asli, cocokkan SHA-256 di bagian bawah halaman ini.
    - title: Pilih data provider
      body: >-
        Buka <b>Settings → Data provider</b> dan setujui pemberitahuan sumber data. EODHD memakai API token Anda
        sendiri. Yahoo tidak perlu token, tetapi sifatnya <b>eksperimental, gratis, dan bisa putus</b> kapan saja.
        Sinkronisasi pertama mengunduh riwayat harga; setelah itu data diperbarui otomatis tiap hari begitu market close.
  install_mac_steps:
    - title: Pasang dari DMG
      body: >-
        Buka file DMG, lalu seret Chartwizard ke folder <b>Applications</b>.
    - title: Peringatan Gatekeeper?
      body: >-
        Build Mac belum ditandatangani atau di-notarize, jadi macOS dapat menolak membuka aplikasi
        (<b>“Chartwizard” cannot be opened…</b>). Buka <b>System Settings → Privacy &amp; Security</b>, lalu klik
        <b>Open Anyway</b>.
      note: >-
        Peringatan ini untuk aplikasi yang belum ditandatangani Apple, bukan temuan virus. Unduh hanya dari halaman
        ini atau GitHub Releases.
    - title: Pilih data provider
      body: >-
        Buka <b>Settings → Data provider</b> dan setujui pemberitahuan sumber data. EODHD memakai API token Anda
        sendiri. Yahoo tidak perlu token, tetapi sifatnya <b>eksperimental, gratis, dan bisa putus</b> kapan saja.
        Sinkronisasi pertama mengunduh riwayat harga; setelah itu data diperbarui otomatis tiap hari begitu market close.

  features_title: Fitur utama
  features:
    - title: "Chart & pola"
      tab: Chart
      shot: chart
      alt: >-
        Chart harian ticker fiktif ARNB di Chartwizard dengan pola double bottom yang ditemukan otomatis, target dan
        level invalidasinya, volume, RSI dan daftar pola.
      body: >-
        Candle, volume, RSI. Indikator MACD, Bollinger, Supertrend. Drawing tools. Pola otomatis: klasik,
        support/resistance, candlestick, divergensi RSI. Enam tema warna, dari gelap sampai pastel.
    - title: Scanner
      tab: Scanner
      shot: scanner
      alt: >-
        Scanner Chartwizard pada ticker fiktif: setup yang sedang aktif, dengan bias, status, skor, rasio volume dan
        nilai transaksi.
      body: >-
        Setup yang aktif di seluruh BEI dalam satu daftar. Versi gratis menampilkan 5 setup teratas. Di Pro, semua setup
        tampil dengan filter likuiditas, lonjakan volume, dan konfirmasi. Tidak perlu membuka chart satu per satu.
    - title: Screener
      tab: Screener
      shot: screener
      alt: >-
        Screener Chartwizard dengan preset Most Active pada ticker fiktif: harga, perubahan harian, volume, nilai
        transaksi dan kapitalisasi pasar.
      pro: true
      body: >-
        Filter berdasarkan harga, return, tren, volume, dan fundamental. Atau pakai preset: Top Gainers, Unusual
        Volume, Low P/E.
    - title: Rotasi sektor
      tab: Sektor
      shot: sectors
      alt: >-
        Rotasi sektor di Chartwizard pada pasar fiktif: jalur setiap sektor terhadap indeks, fase dan momentumnya,
        serta saham terkuat di sektor Financial Services.
      pro: true
      body: >-
        Sektor yang menguat atau melemah versus IHSG, plus saham terkuat di tiap sektor. Memerlukan EODHD (Yahoo tidak
        menyediakan data sektor).

  pricing_title: Free dan Pro
  yes_word: Ya
  pricing_rows:
    - ["Chart: indikator, drawing, pola dan level", "yes", "yes"]
    - ["Sinkronisasi harian otomatis", "yes", "yes"]
    - ["Scanner", "5 setup teratas", "Semua setup dan filter"]
    - ["Screener dan Sektor", "", "yes"]
    - ["Ekspor CSV", "", "yes"]
  buy_monthly: Bayar bulanan
  buy_yearly: Bayar tahunan
  pro_pays_for: >-
    Yang Anda bayar di Pro adalah fitur analisis Chartwizard, bukan data. Di semua paket, data diunduh dari provider
    pilihan Anda, berdasarkan perjanjian Anda sendiri dengan provider itu.
  seats: Satu lisensi untuk 2 komputer. Pembayaran lewat Lynk.id.
  activate_link: Cara mengaktifkan Pro

  faq_title: Pertanyaan umum
  faq:
    - q: Apakah aman? Kenapa Windows memberi peringatan?
      a: >-
        Installer Windows belum ditandatangani secara digital, dan SmartScreen memang memperingatkan setiap aplikasi
        seperti itu. Unduh hanya dari halaman ini atau GitHub Releases, dan cocokkan SHA-256 kalau ingin memastikan.
    - q: Mengapa macOS memblokir Chartwizard?
      a: >-
        Build Mac belum ditandatangani atau di-notarize Apple. Buka <b>System Settings → Privacy &amp; Security</b>,
        lalu pilih <b>Open Anyway</b>. Unduh hanya dari halaman ini atau GitHub Releases.
    - q: Bagaimana cara memperbarui?
      a: >-
        Di Windows, mulai versi 0.3.0 pembaruan otomatis: versi baru diunduh di latar belakang, lalu klik
        <b>Restart now</b> di bilah status. Masih memakai 0.1.0 atau 0.2.0? Unduh versi terbaru di atas dan pasang
        sekali di atas versi lama. Di Mac, unduh DMG terbaru dan pasang ulang ke Applications untuk saat ini
        (auto-update Mac belum dipublikasikan).
    - q: Dari mana data harganya?
      a: >-
        Dari provider yang Anda pilih sendiri, langsung ke komputer Anda, berdasarkan perjanjian Anda dengan provider
        itu: EODHD dengan API token Anda sendiri, atau Yahoo Finance. Chartwizard tidak menjual data dan tidak
        berafiliasi dengan Yahoo maupun EODHD. Yahoo adalah sumber tidak resmi: eksperimental, gratis, dan bisa berhenti
        kapan saja tanpa pemberitahuan. Sebelum mengunduh dari provider mana pun, aplikasi akan meminta Anda menyetujui
        pemberitahuan ini.
    - q: Di mana data disimpan?
      a: >-
        Di Windows: <code>%APPDATA%\idx-chart</code>. Di macOS:
        <code>~/Library/Application Support/idx-chart</code>. Isinya harga, pengaturan, lisensi, dan cadangan harian.
        Uninstall tidak menghapus folder ini, jadi memasang ulang melanjutkan dari data yang sama.
    - q: Sistem apa yang didukung?
      a: >-
        Windows 10 dan 11, 64-bit, serta macOS Apple Silicon (arm64) dalam versi Beta. Belum ada build Intel Mac atau
        Linux.

