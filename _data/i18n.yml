  footer_maker: Made by Codewizard
  og_image_alt: "Chartwizard by Codewizard: the app name beside the Codewizard wave-line circle emblem."
  months: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]

  hero_tagline: IDX chart setups, found automatically.
  hero_intro: >-
    Chartwizard finds chart setups on Indonesia Stock Exchange stocks automatically: classic patterns,
    support/resistance, candlesticks, RSI divergence, and more. The scanner lists active setups across IDX: the top 5 on
    Free, every setup and its filters on Pro. Screener, sector rotation versus IHSG, and CSV export also come with Pro.
    Free to start.
  download_button: Download for Windows
  download_button_mac: Download for Mac (Beta)
  version_label: Version
  size_label: Size
  system_label: System
  date_label: Released
  verify_link: Check the SHA-256
  chart_title: Daily chart of ARNB (a fictitious ticker on invented data) with a double bottom Chartwizard found, plus its target and invalidation.
  tape_label: Scanner sample (fictitious data)
  sample_note: >-
    The chart, scanner results and screenshots on this page use fictitious tickers, company names and prices for
    illustration, not real market data.
  requirements: Windows 10/11 64-bit · macOS Apple Silicon (arm64), Beta
  all_versions: All versions
  file_fallback: Chartwizard-Setup-&lt;version&gt;.exe

  install_title: How to install
  install_windows_heading: Windows
  install_mac_heading: macOS Apple Silicon (Beta)
  install_steps:
    - title: Run the installer
      body: >-
        Open <code>%file%</code> from Downloads and finish the wizard.
    - title: SmartScreen warning?
      body: >-
        The installer is not code-signed yet, so Windows may show the blue
        <b>Windows protected your PC</b> screen. Click <b>More info</b>, then <b>Run anyway</b>.
      note: >-
        That is the unsigned-app warning, not a virus finding. To confirm the file is genuine, match the SHA-256 at the
        bottom of this page.
    - title: Pick a data provider
      body: >-
        Open <b>Settings → Data provider</b> and agree to the data-source notice. EODHD uses your own API token. Yahoo
        needs no token, but it is <b>experimental, free and may break</b> at any time. First sync pulls history; after
        that it updates daily once the market closes.
  install_mac_steps:
    - title: Install from the DMG
      body: >-
        Open the DMG, then drag Chartwizard into <b>Applications</b>.
    - title: Gatekeeper warning?
      body: >-
        The Mac build is not code-signed or notarized yet, so macOS may refuse to open it
        (<b>“Chartwizard” cannot be opened…</b>). Open <b>System Settings → Privacy &amp; Security</b>, then click
        <b>Open Anyway</b>.
      note: >-
        That is the unsigned-app warning, not a virus finding. Download only from this page or GitHub Releases.
    - title: Pick a data provider
      body: >-
        Open <b>Settings → Data provider</b> and agree to the data-source notice. EODHD uses your own API token. Yahoo
        needs no token, but it is <b>experimental, free and may break</b> at any time. First sync pulls history; after
        that it updates daily once the market closes.

  features_title: Key features
  features:
    - title: "Charts & patterns"
      tab: Chart
      shot: chart
      alt: >-
        A daily chart of the fictitious ticker ARNB in Chartwizard with an automatically found double bottom, its target
        and invalidation level, volume, RSI and the pattern list.
      body: >-
        Candles, volume, RSI. MACD, Bollinger, Supertrend. Drawing tools. Auto patterns: classic, support/resistance,
        candlestick, RSI divergence. Six themes, from dark to pastel.
    - title: Scanner
      tab: Scanner
      shot: scanner
      alt: >-
        The Chartwizard scanner on fictitious tickers: active setups with bias, status, score, volume ratio and traded
        value.
      body: >-
        Active setups across IDX in one list. Free shows the top 5. Pro shows every setup, with filters for liquidity,
        volume spikes, and confirmation. You don't have to open charts one by one.
    - title: Screener
      tab: Screener
      shot: screener
      alt: >-
        The Chartwizard screener on the Most Active preset, on fictitious tickers: price, daily change, volume, traded
        value and market cap.
      pro: true
      body: >-
        Filter by price, returns, trend, volume, and fundamentals, or start from a preset: Top Gainers, Unusual Volume,
        Low P/E.
    - title: Sector rotation
      tab: Sectors
      shot: sectors
      alt: >-
        Sector rotation in Chartwizard on a fictitious market: each sector's path against the index, its phase and
        momentum, and the strongest stocks in Financial Services.
      pro: true
      body: >-
        Which sectors are strong or soft versus IHSG, plus the strongest names in each. Needs EODHD (Yahoo has no sector
        data).

  pricing_title: Free and Pro
  yes_word: "Yes"
  pricing_rows:
    - ["Chart: indicators, drawings, patterns and levels", "yes", "yes"]
    - ["Daily auto-sync", "yes", "yes"]
    - ["Scanner", "The top 5 setups", "Every setup and filter"]
    - ["Screener and Sectors", "", "yes"]
    - ["CSV export", "", "yes"]
  buy_monthly: Pay monthly
  buy_yearly: Pay yearly
  pro_pays_for: >-
    With Pro, you pay for Chartwizard's analysis features, not for data. On every plan, data comes from the provider you
    choose, under your own agreement with that provider.
  seats: One licence covers 2 machines. Payment through Lynk.id.
  activate_link: How to activate Pro

  faq_title: Common questions
  faq:
    - q: Is it safe? Why does Windows warn me?
      a: >-
        The Windows installer is not code-signed; SmartScreen warns on every app like that. Download only from this page
        or GitHub Releases, and match the SHA-256 if you want to double-check.
    - q: Why does macOS block Chartwizard?
      a: >-
        The Mac build is not Apple-signed or notarized yet. Open <b>System Settings → Privacy &amp; Security</b>, then
        choose <b>Open Anyway</b>. Download only from this page or GitHub Releases.
    - q: How do I update?
      a: >-
        On Windows, from 0.3.0 Chartwizard updates itself: the new version downloads in the background; click
        <b>Restart now</b> in the status bar to install. Still on 0.1.0 or 0.2.0? Download the latest above and install
        once over the old one. On Mac, download the latest DMG and reinstall into Applications for now (Mac auto-update
        is not published yet).
    - q: Where do the prices come from?
      a: >-
        From the provider you choose, straight to your PC, under your own agreement with that provider: EODHD with your
        own API token, or Yahoo Finance. Chartwizard does not sell data and is not affiliated with Yahoo or EODHD. Yahoo
        is an unofficial source: experimental, free, and it may stop working at any time without notice. The app asks
        you to agree to this notice before it downloads from each provider.
    - q: Where is my data kept?
      a: >-
        On Windows: <code>%APPDATA%\idx-chart</code>. On macOS:
        <code>~/Library/Application Support/idx-chart</code>. Prices, settings, licence, and a daily backup live there.
        Uninstalling keeps that folder, so reinstalling picks up where you left off.
    - q: Which systems are supported?
      a: >-
        Windows 10 and 11, 64-bit, plus macOS Apple Silicon (arm64) as a Beta. No Intel Mac or Linux build yet.

