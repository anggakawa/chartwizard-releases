  hero_tagline: IDX Chart Automatic Setup.
  hero_intro: >-
    Automatic chart setups for Indonesia Stock Exchange names — classic patterns, support/resistance, candlesticks, RSI
    divergence, and more. Scanner lists live setups across the board. Pro unlocks screener, sector rotation versus
    IHSG, CSV export, and live intraday bars. Free to start.
  download_button: Download for Windows
  download_button_mac: Download for Mac
  version_label: Version
  size_label: Size
  system_label: System
  date_label: Released
  verify_link: Check the SHA-256
