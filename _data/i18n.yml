en:
  description: >-
    Charts and a setup scanner for IDX stocks on Windows, plus macOS Apple Silicon (Beta). Free download. The free plan
    shows the top 5 setups; every setup, the filters, and the screener are in Pro.
  nav_download: Download
  nav_guide: Guide
  nav_activate: Activate Pro
  switch_label: ID
  switch_title: Baca dalam Bahasa Indonesia
