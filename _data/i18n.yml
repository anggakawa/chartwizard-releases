  hero_tagline: Grafik dan pemindai pola saham BEI, untuk Windows.
  hero_intro: >-
    Lihat grafik setiap saham di Bursa Efek Indonesia, temukan pola chart secara otomatis, dan pantau sektor mana yang
    sedang menguat. Gratis dipakai, dengan fitur lengkap di Pro.
  download_button: Unduh untuk Windows
  version_label: Versi
  requirements: Windows 10/11 64-bit
  all_versions: Semua versi
  file_fallback: Chartwizard-Setup-&lt;versi&gt;.exe

  install_title: Cara memasang
  install_steps:
    - title: Jalankan file yang diunduh
      body: >-
        Buka <code>{file}</code> dari folder Downloads, lalu ikuti langkah pemasangan sampai selesai.
    - title: Windows memperingatkan? Itu wajar
      body: >-
        Installer Chartwizard belum memiliki tanda tangan digital (code signing), jadi Windows SmartScreen bisa
        menampilkan layar biru <b>Windows protected your PC</b>. Klik <b>More info</b>, lalu <b>Run anyway</b>.
      note: >-
        Peringatan ini muncul untuk setiap aplikasi yang belum ditandatangani, bukan karena ada virus. Ingin
        memastikan filenya asli? Cocokkan SHA-256-nya di bagian bawah halaman ini.
    - title: Pilih sumber data
      body: >-
        Buka <b>Settings → Data provider</b>. <b>Yahoo Finance</b> tidak perlu token; <b>EODHD</b> memakai API token
        milikmu sendiri. Sinkronisasi pertama mengunduh riwayat harga, lalu data diperbarui otomatis setiap hari
        setelah pasar tutup.

  features_title: Fitur
  features:
    - title: Grafik dan pola
      body: >-
        Candlestick, volume dan RSI, indikator seperti MACD, Bollinger Bands dan Supertrend, alat gambar, serta pola
        yang ditemukan otomatis: pola klasik, support/resistance, pola candlestick dan divergensi RSI.
    - title: Scanner
      body: >-
        Semua setup yang sedang aktif di seluruh saham BEI dalam satu daftar, dengan filter likuiditas, lonjakan
        volume dan konfirmasi.
    - title: Screener
      pro: true
      body: >-
        Saring saham berdasarkan harga, return, tren, volume dan fundamental, atau pakai preset seperti Top Gainers,
        Unusual Volume dan Low P/E.
    - title: Rotasi sektor
      pro: true
      body: >-
        Lihat sektor mana yang menguat atau melemah dibanding IHSG, beserta saham terkuat di setiap sektor.

  pricing_title: Free dan Pro
