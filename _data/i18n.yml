  install_title: How to install
  install_windows_heading: Windows
  install_mac_heading: macOS (Apple Silicon)
  install_steps:
    - title: Run the installer
      body: >-
        Open <code>%file%</code> from Downloads and finish the wizard.
    - title: SmartScreen warning?
      body: >-
        The installer is not code-signed yet, so Windows may show the blue
        <b>Windows protected your PC</b> screen. Click <b>More info</b>, then <b>Run anyway</b>.
      note: >-
        That is the unsigned-app warning, not a virus finding. To confirm the file is genuine, match the SHA-256 at the
        bottom of this page.
    - title: Pick a data provider
      body: >-
        Open <b>Settings → Data provider</b>. Yahoo needs no token; EODHD uses your own API token. First sync pulls
        history; after that it updates daily once the market closes.
  install_mac_steps:
    - title: Install from the DMG
      body: >-
        Open the DMG, then drag Chartwizard into <b>Applications</b>.
    - title: Gatekeeper warning?
      body: >-
        The Mac build is not code-signed or notarized yet, so macOS may refuse to open it
        (<b>“Chartwizard” cannot be opened…</b>). Open <b>System Settings → Privacy &amp; Security</b>, then click
        <b>Open Anyway</b>.
      note: >-
        That is the unsigned-app warning, not a virus finding. Download only from this page or GitHub Releases.
    - title: Pick a data provider
      body: >-
        Open <b>Settings → Data provider</b>. Yahoo needs no token; EODHD uses your own API token. First sync pulls
        history; after that it updates daily once the market closes.

  features_title: What you use day to day
  features:
    - title: "Charts & patterns"
      tab: Chart
      shot: chart
      alt: >-
        A daily BBCA chart in Chartwizard with an automatically found double bottom, its target and invalidation level,
        volume, RSI and the pattern list.
      body: >-
        Candles, volume, RSI. MACD, Bollinger, Supertrend. Drawing tools. Auto patterns: classic, support/resistance,
        candlestick, RSI divergence. Six themes — dark to pastel.
    - title: Scanner
      tab: Scanner
      shot: scanner
      alt: >-
        The Chartwizard scanner: live setups across IDX stocks with bias, status, score, volume ratio and traded value.
      body: >-
        Every live setup on IDX in one list. Filter liquidity, volume spikes, and confirmation — so you are not flipping
        charts one by one.
    - title: Screener
      tab: Screener
      shot: screener
      alt: >-
        The Chartwizard screener on the Most Active preset: price, daily change, volume, traded value and market cap.
      pro: true
      body: >-
        Filter by price, returns, trend, volume, and fundamentals — or jump to presets: Top Gainers, Unusual Volume, Low
        P/E.
    - title: Sector rotation
      tab: Sectors
      shot: sectors
      alt: >-
        Sector rotation in Chartwizard: each sector's path against IHSG, its phase and momentum, and the strongest
        stocks in Financial Services.
      pro: true
      body: >-
        Which sectors are strong or soft versus IHSG, plus the strongest names in each. Needs EODHD (Yahoo has no sector
        data).

