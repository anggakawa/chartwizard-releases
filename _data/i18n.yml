  hero_tagline: Setup chart BEI, terdeteksi otomatis.
  hero_intro: >-
    Chartwizard mendeteksi setup di chart saham BEI secara otomatis: pola klasik, support/resistance, candlestick,
    divergensi RSI, dan lainnya. Scanner menampilkan setup yang aktif di seluruh BEI: 5 teratas di versi gratis, semua
    setup dan filternya di Pro. Screener, rotasi sektor terhadap IHSG, dan ekspor CSV juga ada di Pro. Mulai gratis.
  download_button: Unduh untuk Windows
  download_button_mac: Unduh untuk Mac (Beta)
