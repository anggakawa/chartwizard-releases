  buy_monthly: Beli bulanan
  buy_yearly: Beli tahunan
  seats: Satu lisensi untuk 2 PC. Pembayaran lewat Lynk.id.
  activate_link: Cara mengaktifkan Pro

  faq_title: Pertanyaan umum
  faq:
    - q: Aman tidak? Kenapa Windows memperingatkan?
      a: >-
        Installer Chartwizard belum ditandatangani secara digital, dan SmartScreen memperingatkan setiap aplikasi
        seperti itu. Unduh hanya dari halaman ini atau dari halaman rilis di GitHub, dan cocokkan SHA-256-nya jika
        ingin memastikan.
    - q: Bagaimana cara memperbarui?
      a: >-
        Mulai versi 0.3.0, Chartwizard memperbarui dirinya sendiri: versi baru diunduh di latar belakang, lalu klik
        <b>Restart now</b> di bilah status untuk memasangnya. Masih memakai 0.1.0 atau 0.2.0? Unduh versi terbaru di
        atas dan pasang sekali di atas versi lama; setelah itu pembaruan datang sendiri.
    - q: Di mana data saya disimpan?
      a: >-
        Semuanya ada di PC kamu, di folder <code>%APPDATA%\idx-chart</code>: harga, pengaturan, lisensi dan cadangan
        harian. Uninstall tidak menghapus folder ini, jadi memasang ulang melanjutkan dari data yang sama.
    - q: Windows apa saja yang didukung?
      a: Windows 10 dan 11, 64-bit. Belum ada versi untuk macOS atau Linux.

