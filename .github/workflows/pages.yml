# Builds the download site and deploys it to GitHub Pages.
# A published release rebuilds it, so the download button always points at the newest installer.
name: Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue one at a time. Pull requests get their own group, so a PR push never cancels a pending release deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A release run starts on the release's tag; build the current docs from the default branch instead.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the release lookup
        run: node --test ".github/scripts/*.test.mjs"

      # Fails when the newest release has no installer, so a broken button is never deployed.
      - name: Look up the newest release
        run: node .github/scripts/release-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Needs Pages to be enabled, which pull requests do not; baseurl is set in _config.yml.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        env:
          # Pages names a deployment after its build version, which deploy-pages takes from GITHUB_SHA, and hands back the
          # earlier deployment of the same version. A release published with no commit since the last deploy then kept the old
          # site (0.4.2 went out still offering 0.4.1), so every run deploys under a version of its own.
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
