# The download site, built by .github/workflows/pages.yml.
title: Chartwizard
# Served at the root of the custom domain chart.codewizard.id, so there is no base path.
url: https://chart.codewizard.id
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - .github
  # The GitHub front page; the download page replaces it on the site.
  - README.md

# Publish the guides as .html only, not also as raw .md files.
optional_front_matter:
  remove_originals: true

# The guides stay plain Markdown (GitHub shows front matter as a table), so their layout,
# language and other-language page are set here.
defaults:
  - scope: { path: "TUTORIALS-ID.md" }
    values: { layout: doc, lang: id, nav: guide, alt_url: TUTORIALS.html }
  - scope: { path: "TUTORIALS.md" }
    values: { layout: doc, lang: en, nav: guide, alt_url: TUTORIALS-ID.html }
  - scope: { path: "ACTIVATE-PRO.md" }
    values: { layout: doc, lang: id, nav: activate, alt_url: "ACTIVATE-PRO.html#english" }
